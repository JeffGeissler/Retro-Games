name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and verify every weighted outcome
        run: |
          mkdir -p build/java
          javac -encoding UTF-8 -d build/java shared/java/com/jeffgeissler/retroeightball/Responses.java java/src/RetroEightBall.java tests/java/ResponsesTest.java
          java -cp build/java ResponsesTest
          jar --create --file build/RetroEightBall.jar --main-class RetroEightBall -C build/java .
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-java
          path: build/RetroEightBall.jar
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift weighted outcomes
        run: |
          swiftc ios/RetroEightBall/Responses.swift tests/ios/main.swift -o /tmp/responses-test
          /tmp/responses-test
      - name: Build iOS simulator app
        run: xcodebuild -project ios/RetroEightBall.xcodeproj -scheme RetroEightBall -sdk iphonesimulator -configuration Debug -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint Android
        working-directory: android
        run: ./gradlew assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
